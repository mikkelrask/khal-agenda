[package]
name = "khal-agenda"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "An on-demand Wayland calendar popup for khal"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_8"] }
gtk4-layer-shell = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
